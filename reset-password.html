<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Secure password recovery for Savannah AI Labeling accounts.">
<title>Password Recovery | Savannah AI Labeling</title>
<style>
:root{--green:#183D2B;--green2:#28563d;--gold:#C6A46A;--ivory:#F7F5EF;--ink:#1e2922;--muted:#68736b}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}.topbar{background:var(--green);color:#fff;padding:14px 0}.wrap{width:min(1080px,92%);margin:auto}.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font:23px Georgia,serif}.main{padding:55px 0}.panel{max-width:520px;margin:auto;background:#fff;border:1px solid #e7e3d8;border-radius:9px;padding:28px;box-shadow:0 8px 28px #183d2b0b}h1{font:bold 30px Georgia,serif;color:var(--green);margin:0 0 8px}p{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #d7d9d2;border-radius:4px;font:inherit}.btn{display:inline-block;border:1px solid var(--gold);border-radius:4px;padding:11px 16px;background:var(--gold);color:#17291d;font-weight:700;cursor:pointer;margin-top:18px}.notice{padding:12px 14px;border-radius:5px;background:#f1eee5;margin:14px 0;font-size:14px}.error{background:#fff0ed;color:#8b2f20}.success{background:#edf6ed;color:#245a32}.hidden{display:none!important}a{color:var(--green);font-weight:700}.hint{font-size:13px}@media(max-width:600px){.panel{padding:20px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="./"><span class="mark">S</span><span>SAVANNAH AI LABELING</span></a></div></header>
<main class="main wrap">
<section class="panel">
  <section id="requestPanel">
    <h1>Reset your password</h1>
    <p>Enter the email address linked to your Savannah account. We will send you a secure password-reset link.</p>
    <form id="requestForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="btn" id="requestButton" type="button" onclick="(async()=>{const b=this,s=document.getElementById('status'),email=document.getElementById('email').value.trim(),original=b.textContent;const show=(m,c='')=>{s.textContent=m;s.className='notice'+(c?' '+c)};if(!email){show('Enter the email address linked to your Savannah account.','error');return}b.disabled=true;b.textContent='Sending...';show('Contacting the secure password-reset service. Please wait.');try{const redirect=location.origin+location.pathname;const response=await fetch('https://vlbmtkkkpqaumdhysoby.supabase.co/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_Dr98oLwQUvDSur611h0S3w_W-Xgw66L'},body:JSON.stringify({email})});if(!response.ok){let detail='';try{const data=await response.json();detail=data.msg||data.message||data.error_description||data.error||''}catch(_){}throw new Error(detail||'The reset service returned HTTP '+response.status+'.')}show('If an account exists for that email, a password-reset link has been requested. Check your inbox and spam folder.','success')}catch(err){show(err.message||'Unable to contact the password-reset service. Please try again.','error')}finally{b.disabled=false;b.textContent=original}})()">Send reset link</button>
    </form>
  </section>
  <section id="updatePanel" class="hidden">
    <h1>Choose a new password</h1>
    <p>Enter and confirm your new password. Use at least 8 characters.</p>
    <form id="updateForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button class="btn" id="updateButton" type="submit">Save new password</button>
    </form>
  </section>
  <div id="status" class="notice hidden" role="status" aria-live="polite"></div>
  <p class="hint"><a href="portal-access.html">Return to portal selection</a></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function showStatus(message,type=''){const el=$('status');el.textContent=message;el.className='notice'+(type?' '+type);}
function showUpdateForm(){ $('requestPanel').classList.add('hidden'); $('updatePanel').classList.remove('hidden'); $('status').classList.add('hidden'); }
let supabasePromise;
function getSupabase(){
 if(!supabasePromise) supabasePromise=import('https://esm.sh/@supabase/supabase-js@2.49.1').then(({createClient})=>createClient('https://vlbmtkkkpqaumdhysoby.supabase.co','sb_publishable_Dr98oLwQUvDSur611h0S3w_W-Xgw66L'));
 return supabasePromise;
}
window.sendResetLink=async function(e){
 if(e)e.preventDefault();
 const button=$('requestButton'),original=button.textContent;
 button.disabled=true;button.textContent='Sending...';
 showStatus('Submitting your password-reset request. Please wait.');
 try{
  const supabase=await getSupabase();
  const email=$('email').value.trim();
  if(!email)throw new Error('Enter the email address linked to your Savannah account.');
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
  if(error)throw error;
  showStatus('If an account exists for that email, a password-reset link has been requested. Please check your inbox and spam folder.','success');
 }catch(err){showStatus(err.message||'Unable to send the reset email. Please try again.','error');}
 finally{button.disabled=false;button.textContent=original;}
};
$('requestForm').addEventListener('submit',window.sendResetLink);
$('updateForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=$('updateButton'),original=button.textContent;
 button.disabled=true;button.textContent='Saving...';
 try{
  const supabase=await getSupabase();
  const password=$('newPassword').value,confirmation=$('confirmPassword').value;
  if(password.length<8)throw new Error('Use at least 8 characters for your password.');
  if(password!==confirmation)throw new Error('The passwords do not match.');
  const {error}=await supabase.auth.updateUser({password});
  if(error)throw error;
  await supabase.auth.signOut();
  $('updatePanel').classList.add('hidden');
  showStatus('Your password has been changed. You can now sign in with your new password.','success');
  const link=document.createElement('a');link.href='portal-access.html';link.textContent='Go to portal selection';link.style.display='inline-block';link.style.marginTop='12px';$('status').append(' ');$('status').append(link);
 }catch(err){showStatus(err.message||'Unable to update your password. Request a new reset link and try again.','error');}
 finally{button.disabled=false;button.textContent=original;}
});
(async()=>{
 try{
  const supabase=await getSupabase();
  supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showUpdateForm();});
  const {data:{session},error}=await supabase.auth.getSession();
  if(error)showStatus('Unable to verify the reset link: '+error.message,'error');
  if(session&&window.location.hash.includes('access_token'))showUpdateForm();
 }catch(err){showStatus('The password-reset service could not load: '+(err.message||'Please refresh and try again.'),'error');}
 const hashParams=new URLSearchParams(window.location.hash.slice(1));
 const queryParams=new URLSearchParams(window.location.search);
 const description=hashParams.get('error_description')||queryParams.get('error_description');
 if(description)showStatus(description.replace(/\+/g,' ')+' Request a new reset link if it has expired.','error');
})();
</script>
</body>
</html>
